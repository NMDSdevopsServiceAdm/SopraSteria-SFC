<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <div class="govuk-grid-column-one-half govuk-!-padding-left-0">
      @switch (showMissing) { @case (true) {
      <a
        (click)="toggleShowAll()"
        class="govuk-button govuk-button--link govuk-!-padding-left-0 govuk-!-padding-top-4 govuk-!-margin-bottom-0"
        >Show all references</a
      >
      } @case (false) {
      <p class="govuk-util__inline-block govuk-!-padding-top-4 govuk-!-margin-bottom-0">Show all references</p>
      } }
    </div>
    <div class="govuk-grid-column-one-half govuk-!-padding-left-0">
      @switch (showMissing) { @case (false) {
      <a
        class="govuk-button govuk-button--link govuk-!-padding-left-0 govuk-!-padding-top-4 govuk-!-margin-bottom-0"
        (click)="toggleShowAll()"
        >Show missing references</a
      >
      } @case (true) {
      <p class="govuk-util__inline-block govuk-!-padding-left-0 govuk-!-padding-top-4 govuk-!-margin-bottom-0">
        Show missing references
      </p>
      } }
    </div>
  </div>
</div>
