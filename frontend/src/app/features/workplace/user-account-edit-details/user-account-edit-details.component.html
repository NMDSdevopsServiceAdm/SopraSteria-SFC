@if (submitted && form.invalid) {
  <app-error-summary [formErrorsMap]="formErrorsMap" [form]="form" [serverError]="serverError"> </app-error-summary>
}

<form #formEl novalidate (ngSubmit)="onSubmit()" [formGroup]="form" id="server-error">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds-from-desktop">
      <fieldset class="govuk-fieldset">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
          <span class="govuk-caption-l">{{ userDetails.fullname }}</span>
          <h1 class="govuk-fieldset__heading">Details</h1>
        </legend>

        @for (item of formControlsMap; track item.name) {
          <div class="govuk-form-group" [class.govuk-form-group--error]="submitted && form.get(item.name).errors">
            <label class="govuk-label" for="{{ item.name }}">
              {{ item.label }}
            </label>
            @if (submitted && form.get(item.name).errors) {
              <span id="{{ item.name }}-error" class="govuk-error-message">
                <span class="govuk-visually-hidden">Error:</span> {{ getFirstErrorMessage(item.name) }}
              </span>
            }
            <input
              class="govuk-input govuk-input--width-20"
              [formControlName]="item.name"
              id="{{ item.name }}"
              name="{{ item.name }}"
              [class.govuk-input--error]="submitted && form.get(item.name).errors"
              type="text"
            />
          </div>
        }
      </fieldset>
    </div>
  </div>

  <app-submit-exit-buttons [return]="return" [exit]="'Cancel'"></app-submit-exit-buttons>
</form>
