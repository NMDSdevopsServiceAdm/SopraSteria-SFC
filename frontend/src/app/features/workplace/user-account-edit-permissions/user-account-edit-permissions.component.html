@if (submitted && (form.invalid || serverError)) {
<app-error-summary [form]="form" [serverError]="serverError"></app-error-summary>
}

<form #formEl (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds-from-desktop">
      <div class="govuk-form-group" [class.govuk-form-group--error]="submitted && form.invalid">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <span class="govuk-caption-l">{{ user?.fullname }}</span>
            <h1 class="govuk-fieldset__heading">Permissions</h1>
          </legend>
          <div class="govuk-radios">
            @for (item of roleRadios; track item.label; let i = $index) {
            <div class="govuk-radios__item">
              <input
                class="govuk-radios__input"
                [formControlName]="'role'"
                id="role-{{ i }}"
                name="role"
                value="{{ item.value }}"
                type="radio"
              />
              <label class="govuk-label govuk-radios__label" for="role-{{ i }}">
                {{ item.label }}
              </label>
            </div>
            @if (user?.displayStatus !== 'Pending' && item.value === 'Edit') {
            <div
              class="govuk-radios__conditional"
              [class.govuk-radios__conditional--hidden]="form.get('role').value !== 'Edit'"
              id="role-conditional-{{ i }}"
            >
              <div class="govuk-checkboxes">
                <div class="govuk-checkboxes__item">
                  <input
                    class="govuk-checkboxes__input"
                    id="primary"
                    name="primary"
                    type="checkbox"
                    [formControlName]="'primary'"
                  />
                  <label class="govuk-label govuk-checkboxes__label" for="primary">Make primary user</label>
                </div>
              </div>
            </div>
            } @if (item.value === 'Read') {
            <div
              class="govuk-radios__conditional"
              [class.govuk-radios__conditional--hidden]="form.get('role').value !== 'Read'"
              id="role-conditional-{{ i }}"
            >
              <div class="govuk-checkboxes">
                <div class="govuk-checkboxes__item">
                  <input
                    class="govuk-checkboxes__input"
                    id="staff-records"
                    name="staffRecordsReadOnly"
                    type="checkbox"
                    [formControlName]="'staffRecordsReadOnly'"
                  />
                  <label class="govuk-label govuk-checkboxes__label" for="staff-records">
                    Also allow this user to view staff records (optional)
                  </label>
                </div>
              </div>
            </div>
            } }
          </div>
        </fieldset>
      </div>
    </div>
  </div>

  <app-submit-exit-buttons [cta]="'Continue'" [exit]="'Cancel'" [return]="return"></app-submit-exit-buttons>
</form>
