<div class="govuk-!-margin-top-6">
  @for (rowNumber of [1, 2]; track rowNumber) {
    <div class="govuk-grid-row">
      @let firstCardInRow = 3 * (rowNumber - 1);
      @let lastCardInRow = firstCardInRow + 3;
      @for (card of cards.slice(firstCardInRow, lastCardInRow); track card.linkText) {
        <div class="govuk-grid-column-one-third asc-card-padding">
          <app-card [image]="card.imageSrc" [customClass]="'asc-card__training-and-quals'">
            <a [routerLink]="card.linkUrl" class="govuk-link govuk-link--no-visited-state asc-card-link" href="#">
              {{ card.linkText }}
            </a>
            <p class="govuk-!-margin-0 asc-card-description">{{ card.description }}</p>
          </app-card>
        </div>
      }
    </div>
  }
</div>
