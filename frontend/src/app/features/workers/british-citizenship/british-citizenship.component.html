@if (submitted && form.invalid) {
  <app-error-summary [formErrorsMap]="formErrorsMap" [form]="form"></app-error-summary>
}

<form #formEl (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds-from-desktop">
      <div
        class="govuk-form-group govuk-!-margin-bottom-4"
        [class.govuk-form-group--error]="submitted && form.get('britishCitizenship').invalid"
      >
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <span class="govuk-caption-l" data-testid="section-heading">{{ section }}</span>
            <h1 class="govuk-fieldset__heading">Do they have British citizenship?</h1>
          </legend>
          <div class="govuk-radios">
            @for (answer of answersAvailable; track $index; let idx = $index) {
              @let answerId = 'britishCitizenship-' + idx;
              <div class="govuk-radios__item">
                <input
                  class="govuk-radios__input"
                  [formControlName]="'britishCitizenship'"
                  [id]="answerId"
                  name="britishCitizenship"
                  type="radio"
                  [value]="answer.value"
                />
                <label class="govuk-label govuk-radios__label" [for]="answerId">
                  {{ answer.tag }}
                </label>
              </div>
            }
          </div>
        </fieldset>
      </div>
    </div>
    @if (insideFlow) {
      <div class="govuk-grid-column-one-third">
        <div class="govuk-!-margin-left-8">
          <app-progress-bar
            data-testid="progress-bar"
            [sections]="staffRecordSections"
            [currentSection]="section"
          ></app-progress-bar>
        </div>
      </div>
    }
  </div>

  <app-submit-button [return]="!insideFlow" (clicked)="setSubmitAction($event)"></app-submit-button>
</form>
