@if (submitted && form.invalid) {
  <app-error-summary [formErrorsMap]="formErrorsMap" [form]="form"></app-error-summary>
}

<form #formEl (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds-from-desktop">
      <div class="govuk-form-group govuk-!-margin-bottom-4">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <span data-testid="section-heading" class="govuk-caption-l">{{ sectionHeading }}</span>
            <h1 class="govuk-fieldset__heading">What is their Nursing and Midwifery Council field of practice?</h1>
          </legend>
          <div class="govuk-checkboxes" [formArrayName]="'nurseFieldOfPractice'">
            @for (field of allNurseFieldsOfPractice; track field.id; let i = $index) {
              @let id = `nurseFieldOfPractice-${i}`;

              <div class="govuk-checkboxes__item">
                <input
                  class="govuk-checkboxes__input"
                  [id]="id"
                  name="nurseFieldOfPractice"
                  [formControlName]="i"
                  type="checkbox"
                  [value]="field.id"
                />
                <label class="govuk-label govuk-checkboxes__label" [for]="id">
                  {{ field.label }}
                </label>
              </div>
            }
          </div>
        </fieldset>
      </div>
    </div>
    @if (insideFlow) {
      <div class="govuk-grid-column-one-third">
        <div class="govuk-!-margin-left-8">
          <app-progress-bar
            data-testid="progress-bar"
            [sections]="staffRecordSections"
            [currentSection]="section"
          ></app-progress-bar>
        </div>
      </div>
    }
  </div>

  <app-submit-button [return]="!insideFlow" (clicked)="setSubmitAction($event)"></app-submit-button>
</form>
