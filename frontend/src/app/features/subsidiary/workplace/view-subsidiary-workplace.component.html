<app-new-dashboard-header
  [workplace]="workplace"
  tab="workplace"
  [updatedDate]="workplace.updated"
  [return]="summaryReturnUrl"
  data-testid="dashboard-header"
>
</app-new-dashboard-header>

@if (workplace) {
<div class="govuk-width-container govuk-!-padding-top-2">
  <app-alert></app-alert>
  @if (canEditEstablishment && addWorkplaceDetailsBanner) {
  <app-inset-text [color]="'todo'">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-full">
        <a [routerLink]="'start' | addWorkplaceDetailsPath: workplace?.uid">
          Start to add more details about your workplace</a
        >
      </div>
    </div>
  </app-inset-text>
  } @if (canEditEstablishment && showCqcDetailsBanner) {
  <app-check-cqc-details data-testid="check-cqc-details-banner"></app-check-cqc-details>
  }
  <app-new-workplace-summary
    [workplace]="workplace"
    [workerCount]="workerCount"
    [return]="summaryReturnUrl"
    [(navigateToTab)]="navigateToTab"
    data-testid="workplace-summary"
  ></app-new-workplace-summary>
</div>
}
