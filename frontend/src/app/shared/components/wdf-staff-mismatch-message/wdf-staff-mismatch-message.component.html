<div class="govuk-summary-list__row govuk-summary-list__row--no-bottom-border">
  <dt class="govuk-summary-list__key"></dt>
  <dd class="govuk-summary-list__value govuk-summary-list__message">
    <span class="govuk-!-margin-bottom-2 govuk-!-margin-top-2 govuk__flex">
      <img *ngIf="icon" class="govuk-!-margin-right-1" src="/assets/images/{{ icon }}.svg" alt="" />{{
        staffMismatchMessage
      }}
    </span>
    @if (workplace.numberOfStaff !== 0) {
    <span class="govuk__nowrap">
      Either change the total or @if (canEditEstablishment) {
      <a [routerLink]="staffRecordsUrl.url" [fragment]="staffRecordsUrl.fragment">view staff records</a>
      } @else { view staff records } to {{ addOrDeleteRecordsMessage }}.
    </span>
    }
  </dd>
  <dd class="govuk-summary-list__value govuk-summary-list__message"></dd>
</div>
<div class="govuk-summary-list__row">
  <dt class="govuk-!-padding-top-2"></dt>
  <dd></dd>
  <dd></dd>
</div>
