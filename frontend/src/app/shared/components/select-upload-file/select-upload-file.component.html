@if (!showDragAndDropZone) {
  <input
    type="file"
    class="select-upload-file-hidden"
    [accept]="accept"
    [multiple]="multiple"
    data-testid="fileInput"
    aria-label="Choose file"
    (change)="handleFileInputChange($event)"
    #hiddenFileInput
  />

  <ng-container *ngTemplateOutlet="selectFileButton"></ng-container>
} @else {
  <ngx-dropzone
    data-testid="dragAndDrop"
    (change)="handleFileDrop($event)"
    [maxFileSize]="20000000"
    [accept]="accept"
    disableClick="true"
    class="govuk-drag-and-drop asc-ngx-dropzone__padding"
    #dropzone
  >
    <div class="asc-ngx-dropzone__inner-wrapper">
      <span class="govuk-body">{{ dragAndDropZoneText }}</span>

      <ng-container *ngTemplateOutlet="selectFileButton"></ng-container>
    </div>
  </ngx-dropzone>
}

<ng-template #selectFileButton>
  <button
    type="button"
    (click)="showFileSelector()"
    [id]="buttonId"
    [class]="'govuk-button govuk-button--secondary ' + buttonClasses"
    [attr.aria-describedby]="ariaDescribedBy"
  >
    {{ buttonText }}
  </button>
</ng-template>
