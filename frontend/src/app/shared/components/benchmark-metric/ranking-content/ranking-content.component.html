<div class="govuk-grid-row">
  <div [ngClass]="{ 'govuk-grid-column-full': !smallText, 'govuk-grid-column-two-thirds-from-desktop': smallText }">
    @if (showRank) {
    <p [ngClass]="{ 'govuk-!-font-size-27': !smallText }">
      Your workplace is ranked {{ rank }} in your comparison group.
    </p>
    } @else {
    <p class="govuk-body govuk-!-margin-bottom-8" [ngClass]="{ 'govuk-!-font-size-27': !smallText }">
      @if (showNoRankMessage) {
      <span [innerHTML]="message"></span> We cannot show where you rank. } @else { We do not have enough data to show
      this comparison yet. Your workplace cannot be ranked without a comparison group. }
    </p>
    }
  </div>
</div>
